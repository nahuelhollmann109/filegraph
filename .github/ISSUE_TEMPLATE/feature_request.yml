name: "Feature request"
description: "Suggest an idea or improvement"
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please search the existing
        issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: "Problem / use case"
      description: "What are you trying to solve, and why does the current behavior fall short?"
      placeholder: "I am trying to ... but filegraph currently ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "How should filegraph behave instead?"
      placeholder: "Add an option to ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Any other approaches or workarounds you have tried."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Anything else that helps explain the request (examples, links, screenshots)."
    validations:
      required: false
