name: "Bug report"
description: "Report something that isn't working"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Issues missing the required fields below
        take longer to triage, so please fill in every section.
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what is broken."
      placeholder: "When I run ..., filegraph does ... instead of ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "How can a maintainer reproduce this behavior?"
      placeholder: |
        1. Run '...'
        2. Observe '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen instead?"
      placeholder: "I expected filegraph to ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / output"
      description: "Paste any relevant logs, traceback, or command output."
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "filegraph version"
      description: "The version of filegraph you are running."
      placeholder: "4.0.10"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: "How did you install filegraph?"
      multiple: false
      options:
        - "curl installer"
        - "manual clone"
        - "pip / Python package"
        - "other"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "Your OS, Python version, and MCP client."
      placeholder: "OS: Ubuntu 24.04, Python: 3.12, Client: Claude Code"
    validations:
      required: true
